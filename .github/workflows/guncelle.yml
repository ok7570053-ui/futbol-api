name: Maclari Guncelle

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Maclari guncelle
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python guncelle.py

      - name: Degisiklikleri kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add maclar.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: maclar.json guncellendi"
            git push
          else
            echo "Degisiklik yok, commit atlandi."
          fi

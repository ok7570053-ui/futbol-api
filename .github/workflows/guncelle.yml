name: 30 Dakikada Bir Mac Guncelleme

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Maclari guncelle
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
        run: |
          python guncelle.py
          if [ -f "puan_durumu.py" ]; then
            python puan_durumu.py
          fi

      - name: Degisiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maclar.json
          if [ -f "standings.json" ]; then
            git add standings.json
          fi
          git diff --staged --quiet || git commit -m "30 dakikalik hibrit fikstur guncellendi"
          git push
